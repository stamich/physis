name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly run of the slow validation suite.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "22"
      - uses: gradle/actions/setup-gradle@v5
      - name: Install a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb
      - name: Format check, compile and unit tests (Linux, with FX smoke tests)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./gradlew spotlessCheck build -PfxSmoke=true --continue --stacktrace 2>&1 | tee build.log
      - name: Format check, compile and unit tests (macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -o pipefail
          ./gradlew spotlessCheck build --continue --stacktrace 2>&1 | tee build.log
      - name: Run the installed physis-cli
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :apps:cli:installDist
          cli="$PWD/apps/cli/build/install/physis-cli/bin/physis-cli"
          work="$(mktemp -d)"
          cd "$work"
          "$cli" --version | grep -q '^physis-cli '
          "$cli" describe physarum | grep -q '^presets:'
          "$cli" sweep --model gray-scott --param nx=32 --param ny=32 \
            --sweep F=0.03,0.05 --until 20 --out sweep.csv --manifests manifests
          test "$(wc -l < sweep.csv)" -eq 3
          first="$(ls manifests/point-*.json | head -n 1)"
          "$cli" replay "$first" > /dev/null
          "$cli" frames frames --model physarum --param n=500 --param nx=64 --param ny=64 \
            --steps 10 --every 10 > /dev/null
          test "$(head -c 8 frames/frame-00001.png | od -An -tx1 | tr -d ' \n')" = "89504e470d0a1a0a"
          if "$cli" run --sweep x=1 2> /dev/null; then echo "a wrong command line was accepted"; exit 1; fi
      - name: Report build errors as annotations
        if: failure()
        shell: bash
        run: python3 .github/scripts/annotate_build_log.py build.log
      - name: Keep Lab screenshots (Linux)
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lab-screenshots
          path: apps/lab/build/screenshots/
          if-no-files-found: ignore

  slow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "22"
      - uses: gradle/actions/setup-gradle@v5
      - name: Slow validation tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew slowTest --continue --stacktrace 2>&1 | tee build.log
      - name: Report test errors as annotations
        if: failure()
        shell: bash
        run: python3 .github/scripts/annotate_build_log.py build.log
      - name: Speed report
        if: always()
        shell: bash
        run: |
          # the numbers the speed tests measured: in the job summary and as one annotation
          lines=$(find . -path '*/build/speed/*.txt' | sort | xargs -r cat)
          if [ -n "$lines" ]; then
            { echo "### Measured speeds"; echo; echo "$lines" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Measured speeds::$(echo "$lines" | tr '\n' ';')"
          fi
