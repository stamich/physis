name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly run of the slow validation suite.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "22"
      - uses: gradle/actions/setup-gradle@v5
      - name: Install a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb
      - name: Format check, compile and unit tests (Linux, with FX smoke tests)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./gradlew spotlessCheck build -PfxSmoke=true --continue --stacktrace 2>&1 | tee build.log
      - name: Format check, compile and unit tests (macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -o pipefail
          ./gradlew spotlessCheck build --continue --stacktrace 2>&1 | tee build.log
      - name: Report build errors as annotations
        if: failure()
        shell: bash
        run: python3 .github/scripts/annotate_build_log.py build.log
      - name: Keep Lab screenshots (Linux)
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lab-screenshots
          path: apps/lab/build/screenshots/
          if-no-files-found: ignore

  slow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "22"
      - uses: gradle/actions/setup-gradle@v5
      - name: Slow validation tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew slowTest --continue --stacktrace 2>&1 | tee build.log
      - name: Report test errors as annotations
        if: failure()
        shell: bash
        run: python3 .github/scripts/annotate_build_log.py build.log
