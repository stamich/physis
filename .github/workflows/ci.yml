name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Nightly run of the slow validation suite.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
      - uses: gradle/actions/setup-gradle@v4
      - name: Format check, compile and unit tests
        run: ./gradlew spotlessCheck build --stacktrace

  slow-tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
      - uses: gradle/actions/setup-gradle@v4
      - name: Slow validation tests
        run: ./gradlew slowTest --stacktrace
